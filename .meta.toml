[meta]
template = "default"
commit-id = "8c30aa23"

[gitignore]
extra_lines = """
**/robot_*.html
robot_output.xml
**/log.html
**/report.html
**test_*/**/output.xml
"""

[github]
jobs = [
    "qa",
    "test",
    "coverage",
    "dependencies",
    "release_ready",
    ]

[pyproject]
dependencies_ignores = "['zestreleaser.towncrier', 'zest.releaser', 'plone.app.upgrade']"

[tox]
# Not on PyPI; the pretagov fork is public
test_deps_additional = "cusy.restapi.info @ git+https://github.com/pretagov/cusy.restapi.info.git@main"
